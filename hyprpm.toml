[hypr-floating]
description = "Floating windows: a window drawn over a full-screen one takes the clicks"
authors = ["Afshin Jalili"]
output = "build/hypr-floating.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build -j",
]
